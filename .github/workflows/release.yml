# Builds the Windows installer and publishes it as a GitHub Release whenever a version tag
# (e.g. v0.2.0) is pushed. Created by `npm run release`. Installed apps pick it up as an update.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Type check
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Build installer and publish release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
