# Builds the Windows installer and publishes it as a GitHub Release whenever a version tag
# (e.g. v0.2.0) is pushed. Created by `npm run release`. Installed apps pick it up as an update.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Type check
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Build installer
        run: npx electron-builder --win --publish never

      # One single step creates the release and uploads everything, so there can never be
      # duplicate releases. latest.yml is what installed apps read to find updates.
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = Get-ChildItem release -File | Where-Object { ($_.Name -like 'Cutly-Setup-*.exe' -and $_.Name -notlike '*uninstaller*') -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName }
          gh release create $tag @files --title "Cutly $($tag.TrimStart('v'))" --generate-notes --latest
